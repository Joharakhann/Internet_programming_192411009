
<!DOCTYPE html>
<html>
<head>
    <title>BlossomGifts</title>
    <link rel="stylesheet" href="exp13.css">
</head>
<body>

<header>
    <h1>BlossomGifts</h1>
    <p>Make Every Moment Special</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#gifts">Gifts</a>
    <a href="#order">Order</a>
    <a href="#admin">Admin</a>
</nav>

<section class="hero" id="home">
    <h2>Find the Perfect Gift</h2>
    <p>Gifts for every special occasion.</p>
</section>

<section id="gifts">
    <h2>Available Gifts</h2>

    <input id="search" placeholder="Search gifts..."
           oninput="showGifts()">

    <select id="category" onchange="showGifts()">
        <option value="All">All Categories</option>
        <option>Flowers</option>
        <option>Cakes</option>
        <option>Toys</option>
    </select>

    <div id="giftList" class="products"></div>
</section>

<section class="panel">
    <h2>Shopping Cart</h2>
    <div id="cartList">Cart is empty.</div>
    <h3 id="total">Total: ₹0</h3>
</section>

<section id="order" class="panel">
    <h2>Place Order</h2>
    <form onsubmit="placeOrder(event)">
        <input id="customer" placeholder="Customer Name" required>
        <input id="address" placeholder="Delivery Address" required>
        <input id="date" type="date" required>
        <button>Place Order</button>
    </form>
    <p id="message"></p>
</section>

<section id="admin" class="panel">
    <h2>Admin - Add Gift</h2>
    <form onsubmit="addGift(event)">
        <input id="giftName" placeholder="Gift Name" required>
        <select id="giftCategory">
            <option>Flowers</option>
            <option>Cakes</option>
            <option>Toys</option>
        </select>
        <input id="giftPrice" type="number"
               placeholder="Price" min="1" required>
        <button>Add Gift</button>
    </form>
    <p id="adminMessage"></p>
</section>

<footer>BlossomGifts © 2026</footer>

<script>
let gifts = [
    {name:"Rose Bouquet", category:"Flowers", price:500},
    {name:"Chocolate Cake", category:"Cakes", price:700},
    {name:"Teddy Bear", category:"Toys", price:400}
];

let cart = [];

function showGifts() {
    let list = document.getElementById("giftList");
    let search = document.getElementById("search").value.toLowerCase();
    let category = document.getElementById("category").value;

    list.innerHTML = "";

    gifts.forEach(function(gift, index) {
        if (gift.name.toLowerCase().includes(search) &&
            (category === "All" || gift.category === category)) {
            list.innerHTML += `
                <div class="card">
                    <h3>${gift.name}</h3>
                    <p>${gift.category}</p>
                    <h3>₹${gift.price}</h3>
                    <button onclick="addCart(${index})">Add to Cart</button>
                </div>`;
        }
    });
}

function addCart(index) {
    cart.push(gifts[index]);
    showCart();
}

function showCart() {
    let list = document.getElementById("cartList");
    let total = 0;
    list.innerHTML = "";

    cart.forEach(function(gift, index) {
        total += gift.price;
        list.innerHTML += `
            <p>${gift.name} - ₹${gift.price}
            <button onclick="removeCart(${index})">Remove</button></p>`;
    });

    if (cart.length === 0) list.innerHTML = "Cart is empty.";
    document.getElementById("total").innerText = "Total: ₹" + total;
}

function removeCart(index) {
    cart.splice(index, 1);
    showCart();
}

function placeOrder(event) {
    event.preventDefault();

    if (cart.length === 0) {
        document.getElementById("message").innerText =
            "Please add a gift first.";
        return;
    }

    document.getElementById("message").innerText =
        "Thank you " + document.getElementById("customer").value +
        "! Demo order placed for " + document.getElementById("date").value;

    cart = [];
    showCart();
    event.target.reset();
}

function addGift(event) {
    event.preventDefault();

    gifts.push({
        name: document.getElementById("giftName").value,
        category: document.getElementById("giftCategory").value,
        price: Number(document.getElementById("giftPrice").value)
    });

    showGifts();
    document.getElementById("adminMessage").innerText =
        "Gift added successfully.";
    event.target.reset();
}

showGifts();
showCart();
</script>

</body>
</html>
