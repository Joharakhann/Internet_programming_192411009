
<!DOCTYPE html>
<html>
<head>
    <title>AgriMart</title>
    <link rel="stylesheet" href="exp18.css">
</head>
<body>

<header>
    <h1>AgriMart</h1>
    <p>Your Online Agricultural Store</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#cart">My Cart</a>
    <a href="#farmer">Farmer</a>
</nav>

<section class="hero" id="home">
    <h2>Everything for Better Farming</h2>
    <p>Buy seeds, fertilizers, tools and more.</p>
</section>

<section id="products">
    <h2>Available Products</h2>

    <input id="search" placeholder="Search products..."
           oninput="showProducts()">

    <select id="category" onchange="showProducts()">
        <option value="All">All Categories</option>
        <option>Seeds</option>
        <option>Fertilizers</option>
        <option>Tools</option>
    </select>

    <div id="productList" class="products"></div>
</section>

<section id="cart" class="panel">
    <h2>My Cart</h2>
    <div id="cartList">Cart is empty.</div>
    <h3 id="total">Total: ₹0</h3>

    <form onsubmit="placeOrder(event)">
        <input id="customer" placeholder="Customer Name" required>
        <input id="address" placeholder="Shipping Address" required>
        <button>Place Order</button>
    </form>

    <p id="orderMessage"></p>
</section>

<section id="farmer" class="panel">
    <h2>Farmer - Add Product</h2>

    <form onsubmit="addProduct(event)">
        <input id="farmerName" placeholder="Farmer Name" required>
        <input id="productName" placeholder="Product Name" required>

        <select id="newCategory">
            <option>Seeds</option>
            <option>Fertilizers</option>
            <option>Tools</option>
        </select>

        <input id="price" type="number" min="1"
               placeholder="Price" required>

        <button>Add Product</button>
    </form>

    <p id="farmerMessage"></p>
</section>

<section class="panel">
    <h2>Manage Products</h2>
    <button onclick="removeLast()">Delete Last Product</button>
    <p id="adminMessage"></p>
</section>

<footer>AgriMart © 2026</footer>

<script>
let products = [
    {name:"Tomato Seeds", category:"Seeds", price:150},
    {name:"Organic Fertilizer", category:"Fertilizers", price:500},
    {name:"Garden Tools", category:"Tools", price:350},
    {name:"Rice Seeds", category:"Seeds", price:250}
];

let cart = [];

function showProducts() {
    let list = document.getElementById("productList");
    let search = document.getElementById("search").value.toLowerCase();
    let category = document.getElementById("category").value;

    list.innerHTML = "";

    products.forEach(function(p, index) {
        if (p.name.toLowerCase().includes(search) &&
            (category === "All" || p.category === category)) {
            list.innerHTML += `
                <div class="card">
                    <h3>${p.name}</h3>
                    <p>Category: ${p.category}</p>
                    <h3>₹${p.price}</h3>
                    <button onclick="addCart(${index})">Add to Cart</button>
                </div>`;
        }
    });
}

function addCart(index) {
    cart.push(products[index]);
    showCart();
}

function showCart() {
    let list = document.getElementById("cartList");
    let total = 0;
    list.innerHTML = "";

    cart.forEach(function(p, index) {
        total += p.price;

        list.innerHTML += `
            <p>${p.name} - ₹${p.price}
            <button onclick="removeCart(${index})">Remove</button></p>`;
    });

    if (cart.length === 0) list.innerText = "Cart is empty.";

    document.getElementById("total").innerText = "Total: ₹" + total;
}

function removeCart(index) {
    cart.splice(index, 1);
    showCart();
}

function placeOrder(event) {
    event.preventDefault();

    if (cart.length === 0) {
        document.getElementById("orderMessage").innerText =
            "Please add products to the cart first.";
        return;
    }

    document.getElementById("orderMessage").innerText =
        "Thank you " + document.getElementById("customer").value +
        "! Demo order placed successfully.";

    cart = [];
    showCart();
    event.target.reset();
}

function addProduct(event) {
    event.preventDefault();

    products.push({
        name: document.getElementById("productName").value,
        category: document.getElementById("newCategory").value,
        price: Number(document.getElementById("price").value)
    });

    showProducts();

    document.getElementById("farmerMessage").innerText =
        "Product added successfully by " +
        document.getElementById("farmerName").value + ".";

    event.target.reset();
}

function removeLast() {
    if (products.length > 0) {
        let removed = products.pop();
        document.getElementById("adminMessage").innerText =
            removed.name + " deleted successfully.";
    } else {
        document.getElementById("adminMessage").innerText =
            "No products available.";
    }

    showProducts();
}

showProducts();
showCart();
</script>

</body>
</html>
