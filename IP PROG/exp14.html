
<!DOCTYPE html>
<html>
<head>
    <title>ReNewMarket</title>
    <link rel="stylesheet" href="exp14.css">
</head>
<body>

<header>
    <h1>ReNewMarket</h1>
    <p>Buy Smart. Reuse More.</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#sell">Sell Product</a>
    <a href="#admin">Admin</a>
</nav>

<section class="hero" id="home">
    <h2>Second-Hand Marketplace</h2>
    <p>Find affordable pre-loved products.</p>
</section>

<section id="products">
    <h2>Available Products</h2>
    <input id="search" placeholder="Search products..."
           oninput="showProducts()">

    <select id="category" onchange="showProducts()">
        <option value="All">All Categories</option>
        <option>Electronics</option>
        <option>Furniture</option>
        <option>Books</option>
    </select>

    <input type="number" id="maxPrice" placeholder="Maximum price"
           min="0" oninput="showProducts()">

    <div id="productList" class="products"></div>
</section>

<section class="panel">
    <h2>Order Details</h2>
    <p id="orderMessage">No order placed.</p>
</section>

<section id="sell" class="panel">
    <h2>Sell a Product</h2>
    <form onsubmit="addProduct(event)">
        <input id="seller" placeholder="Seller Name" required>
        <input id="productName" placeholder="Product Name" required>

        <select id="newCategory">
            <option>Electronics</option>
            <option>Furniture</option>
            <option>Books</option>
        </select>

        <input id="price" type="number" min="1"
               placeholder="Price" required>
        <button>List Product</button>
    </form>
    <p id="sellMessage"></p>
</section>

<section id="admin" class="panel">
    <h2>Admin Dashboard</h2>
    <p>Total Products: <span id="count">0</span></p>
    <button onclick="showCategories()">View Categories</button>
    <button onclick="removeLast()">Remove Last Listing</button>
    <p id="adminMessage"></p>
</section>

<footer>ReNewMarket © 2026</footer>

<script>
let products = [
    {name:"Used Laptop", category:"Electronics", price:15000},
    {name:"Study Table", category:"Furniture", price:2500},
    {name:"Programming Book", category:"Books", price:300},
    {name:"Headphones", category:"Electronics", price:800}
];

function showProducts() {
    let list = document.getElementById("productList");
    let search = document.getElementById("search").value.toLowerCase();
    let category = document.getElementById("category").value;
    let max = document.getElementById("maxPrice").value;

    list.innerHTML = "";

    products.forEach(function(p, index) {
        if (p.name.toLowerCase().includes(search) &&
            (category === "All" || p.category === category) &&
            (max === "" || p.price <= Number(max))) {
            list.innerHTML += `
                <div class="card">
                    <h3>${p.name}</h3>
                    <p>${p.category}</p>
                    <h3>₹${p.price}</h3>
                    <button onclick="buyProduct(${index})">Order Product</button>
                </div>`;
        }
    });

    document.getElementById("count").innerText = products.length;
}

function buyProduct(index) {
    let p = products[index];
    document.getElementById("orderMessage").innerText =
        "Demo order placed for " + p.name + " - ₹" + p.price;
}

function addProduct(event) {
    event.preventDefault();

    products.push({
        name: document.getElementById("productName").value,
        category: document.getElementById("newCategory").value,
        price: Number(document.getElementById("price").value)
    });

    showProducts();
    document.getElementById("sellMessage").innerText =
        "Product listed successfully by " +
        document.getElementById("seller").value + ".";

    event.target.reset();
}

function showCategories() {
    let categories = [];

    products.forEach(function(p) {
        if (!categories.includes(p.category)) {
            categories.push(p.category);
        }
    });

    document.getElementById("adminMessage").innerText =
        "Categories: " + categories.join(", ");
}

function removeLast() {
    if (products.length > 0) {
        let removed = products.pop();
        document.getElementById("adminMessage").innerText =
            removed.name + " listing removed.";
    } else {
        document.getElementById("adminMessage").innerText =
            "No products available.";
    }
    showProducts();
}

showProducts();
</script>

</body>
</html>
