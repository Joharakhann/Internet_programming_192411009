
<!DOCTYPE html>
<html>
<head>
    <title>ComplainEase</title>
    <link rel="stylesheet" href="exp16.css">
</head>
<body>

<header>
    <h1>ComplainEase</h1>
    <p>Report. Track. Resolve.</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#complaint">Submit Complaint</a>
    <a href="#officer">Officer</a>
    <a href="#admin">Admin</a>
</nav>

<section class="hero" id="home">
    <h2>Complaint Management System</h2>
    <p>Submit complaints and check their status.</p>
</section>

<section id="complaint" class="panel">
    <h2>Register Complaint</h2>
    <form onsubmit="submitComplaint(event)">
        <input id="name" placeholder="Your Name" required>
        <input id="email" type="email" placeholder="Email" required>

        <select id="category">
            <option>Water Problem</option>
            <option>Road Problem</option>
            <option>Electricity Problem</option>
            <option>Other</option>
        </select>

        <textarea id="description"
                  placeholder="Describe your complaint" required></textarea>

        <input id="location" placeholder="Complaint Location" required>
        <button>Submit Complaint</button>
    </form>
    <p id="submitMessage"></p>
</section>

<section class="panel">
    <h2>My Complaints</h2>
    <div id="complaintList">No complaints submitted.</div>
</section>

<section id="officer" class="panel">
    <h2>Officer Dashboard</h2>
    <input type="number" id="complaintId" placeholder="Complaint ID" min="1">

    <select id="status">
        <option>Pending</option>
        <option>In Progress</option>
        <option>Resolved</option>
    </select>

    <button onclick="updateStatus()">Update Status</button>
    <p id="officerMessage"></p>
</section>

<section id="admin" class="panel">
    <h2>Admin Dashboard</h2>
    <p>Total Complaints: <span id="count">0</span></p>
    <button onclick="showAll()">View All Complaints</button>
    <div id="adminList"></div>
</section>

<section class="panel">
    <h2>Feedback</h2>
    <form onsubmit="sendFeedback(event)">
        <input id="feedbackName" placeholder="Your Name" required>
        <textarea id="feedbackText" placeholder="Your feedback"
                  required></textarea>
        <button>Submit Feedback</button>
    </form>
    <p id="feedbackMessage"></p>
</section>

<footer>ComplainEase © 2026</footer>

<script>
let complaints = [];
let nextId = 1;

function submitComplaint(event) {
    event.preventDefault();

    let complaint = {
        id: nextId++,
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        category: document.getElementById("category").value,
        description: document.getElementById("description").value,
        location: document.getElementById("location").value,
        status: "Pending"
    };

    complaints.push(complaint);

    document.getElementById("submitMessage").innerText =
        "Complaint submitted. Your ID is " + complaint.id;

    event.target.reset();
    showAll();
}

function showAll() {
    let list = document.getElementById("complaintList");
    let admin = document.getElementById("adminList");

    list.innerHTML = "";
    admin.innerHTML = "";

    if (complaints.length === 0) {
        list.innerText = "No complaints submitted.";
    }

    complaints.forEach(function(c) {
        let details = "ID: " + c.id + " | " + c.category +
            " | Status: " + c.status;

        list.innerHTML += "<p>" + details + "</p>";

        admin.innerHTML += "<p>ID: " + c.id + " - " +
            c.name + " - " + c.location + " - " + c.status + "</p>";
    });

    document.getElementById("count").innerText = complaints.length;
}

function updateStatus() {
    let id = Number(document.getElementById("complaintId").value);
    let complaint = complaints.find(function(c) {
        return c.id === id;
    });

    if (complaint) {
        complaint.status = document.getElementById("status").value;
        document.getElementById("officerMessage").innerText =
            "Complaint status updated.";
        showAll();
    } else {
        document.getElementById("officerMessage").innerText =
            "Complaint ID not found.";
    }
}

function sendFeedback(event) {
    event.preventDefault();

    document.getElementById("feedbackMessage").innerText =
        "Thank you for your feedback, " +
        document.getElementById("feedbackName").value + ".";

    event.target.reset();
}
</script>

</body>
</html>
