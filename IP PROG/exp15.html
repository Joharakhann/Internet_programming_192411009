
<!DOCTYPE html>
<html>
<head>
    <title>EasyToll</title>
    <link rel="stylesheet" href="exp15.css">
</head>
<body>

<header>
    <h1>EasyToll</h1>
    <p>Fast and Easy Toll Management</p>
</header>

<nav>
    <a href="#home">Home</a>
    <a href="#account">My Account</a>
    <a href="#pass">Toll Pass</a>
    <a href="#admin">Admin</a>
</nav>

<section class="hero" id="home">
    <h2>Pay Toll Before You Travel</h2>
    <p>Manage your wallet, vehicles and toll passes.</p>
</section>

<section id="account" class="panel">
    <h2>User Registration / Login</h2>
    <form onsubmit="login(event)">
        <input id="username" placeholder="Username" required>
        <input id="password" type="password"
               placeholder="Password" required>
        <button>Login</button>
    </form>
    <p id="loginMessage"></p>
</section>

<section class="panel">
    <h2>eWallet</h2>
    <h3>Balance: ₹<span id="balance">500</span></h3>
    <input type="number" id="amount" placeholder="Enter amount" min="1">
    <button onclick="addMoney()">Add Money</button>
    <p id="walletMessage"></p>
</section>

<section id="pass" class="panel">
    <h2>Buy Toll e-Ticket</h2>
    <form onsubmit="buyTicket(event)">
        <input id="vehicle" placeholder="Vehicle Number" required>
        <input id="toll" placeholder="Toll Gate Name" required>
        <input id="fee" type="number" placeholder="Toll Fee"
               min="1" required>
        <button>Buy Ticket</button>
    </form>
    <p id="ticketMessage"></p>
</section>

<section class="panel">
    <h2>Apply / Renew Toll Pass</h2>
    <input id="passVehicle" placeholder="Vehicle Number">
    <button onclick="applyPass()">Apply for Pass</button>
    <p id="passMessage"></p>
</section>

<section id="admin" class="panel">
    <h2>Admin Dashboard</h2>
    <input id="adminToll" placeholder="Toll Gate Name">
    <input id="adminFee" type="number" min="1" placeholder="Toll Fee">
    <button onclick="addToll()">Add Toll Details</button>
    <div id="tollList"></div>
</section>

<footer>EasyToll © 2026</footer>

<script>
let balance = 500;
let tolls = [];

function login(event) {
    event.preventDefault();
    document.getElementById("loginMessage").innerText =
        "Demo login successful!";
}

function addMoney() {
    let amount = Number(document.getElementById("amount").value);

    if (amount <= 0) {
        document.getElementById("walletMessage").innerText =
            "Enter a valid amount.";
        return;
    }

    balance += amount;
    document.getElementById("balance").innerText = balance;
    document.getElementById("walletMessage").innerText =
        "Money added successfully.";
}

function buyTicket(event) {
    event.preventDefault();

    let fee = Number(document.getElementById("fee").value);

    if (fee > balance) {
        document.getElementById("ticketMessage").innerText =
            "Insufficient wallet balance.";
        return;
    }

    balance -= fee;
    document.getElementById("balance").innerText = balance;

    document.getElementById("ticketMessage").innerText =
        "Demo ticket purchased for " +
        document.getElementById("vehicle").value +
        " at " + document.getElementById("toll").value +
        ". Amount paid: ₹" + fee;
    event.target.reset();
}

function applyPass() {
    let vehicle = document.getElementById("passVehicle").value;

    if (vehicle.trim() === "") {
        document.getElementById("passMessage").innerText =
            "Enter vehicle number.";
        return;
    }

    document.getElementById("passMessage").innerText =
        "Toll pass application submitted for " + vehicle + ".";
}

function addToll() {
    let name = document.getElementById("adminToll").value;
    let fee = Number(document.getElementById("adminFee").value);

    if (name.trim() === "" || fee <= 0) {
        alert("Enter valid toll details.");
        return;
    }

    tolls.push({name: name, fee: fee});
    showTolls();

    document.getElementById("adminToll").value = "";
    document.getElementById("adminFee").value = "";
}

function showTolls() {
    let list = document.getElementById("tollList");
    list.innerHTML = "<h3>Toll Details</h3>";

    tolls.forEach(function(t) {
        list.innerHTML += "<p>" + t.name + " - ₹" + t.fee + "</p>";
    });
}
</script>

</body>
</html>
